[project]
# Whether to enable telemetry (default: true). No personal data is collected.
enable_telemetry = false

# List of environment variables to be provided by each user to use the app.
user_env = []

# Duration (in seconds) during which the session is saved when the connection is lost
session_timeout = 3600

# Enable third parties caching (e.g LangChain cache)
cache = false

# Authorized origins
[project.authorized_origins]
# origins = ["http://localhost:3000"]

# Limit upload
[project.upload]
# Maximum file size in megabytes
max_size_mb = 10
# Maximum number of files per request
max_files = 10

[features]
# Process and display HTML in messages
unsafe_allow_html = false

# Process and display mathematical expressions. This can receive:
# - `false`: No processing
# - `true`: Process all expressions
# - `math-only`: Only process expressions starting with `$` and containing `$$`
latex = false

# Automatically tag threads when they are created
auto_tag_thread = false

# Process and display code with syntax highlighting
code_highlight = true

# Automatically tag threads when they are created
auto_tag_thread = false

# Process and display code with syntax highlighting
code_highlight = true

# Show the prompt playground
prompt_playground = false

# Process and display code with syntax highlighting
code_highlight = true

# Show the prompt playground
prompt_playground = false

# Automatically tag threads when they are created
auto_tag_thread = false

[UI]
# Name of the app and chatbot.
name = "Deep Research Assistant"

# Show the readme while the thread is empty.
show_readme_as_default = true

# Description of the app and chatbot. This is used for HTML tags.
description = "AI-powered deep research assistant for scientific literature analysis"

# Large size content are by default collapsed for a cleaner ui
default_collapse_content = false

# The default value for the expand messages settings.
default_expand_messages = true

# Hide the chain of thought details from the user in the UI.
hide_cot = false

# Link to your github repo. This will add a github button in the UI's header.
# github = ""

# Specify a CSS file that can be used to customize the user interface.
# The CSS file should be placed in the .chainlit/public directory.
# custom_css = "/public/style.css"

# Specify a Javascript file that can be used to customize the user interface.
# The Javascript file should be placed in the .chainlit/public directory.
# custom_js = "/public/script.js"

# Override default MUI light theme. (Check theme.ts)
[UI.theme]
# palette = "blue"